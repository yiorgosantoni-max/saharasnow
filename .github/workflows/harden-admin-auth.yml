name: Harden admin auth
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin auth initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/admin/page.tsx')
          s=p.read_text()
          old='useEffect(()=>{let stop=()=>{};try{const auth=getClientAuth();stop=onAuthStateChanged(auth,user=>{if(user)void load(user);else{setData(null);setError("Sign in with yiorgosantoni@gmail.com on the homepage first.");}});}catch(e){setError(e instanceof Error?e.message:"Unable to initialize administrator sign-in.");}return ()=>stop();},[]);'
          new='useEffect(()=>{let cancelled=false;const start=async()=>{try{const auth=getClientAuth();await auth.authStateReady();if(cancelled)return;const user=auth.currentUser;if(user)await load(user);else{setData(null);setError("Sign in with yiorgosantoni@gmail.com on the homepage first.");}}catch(e){if(!cancelled)setError(e instanceof Error?e.message:"Unable to initialize administrator sign-in.");}};void start();return ()=>{cancelled=true;};},[]);'
          if old not in s:
              raise SystemExit('Expected admin auth effect was not found; refusing to modify.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Remove direct observer import if unused
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/admin/page.tsx'); s=p.read_text(); s=s.replace('import { onAuthStateChanged, type User } from "firebase/auth";','import { type User } from "firebase/auth";'); p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/page.tsx
          git commit -m 'Stabilize admin Firebase auth initialization'
          git push
