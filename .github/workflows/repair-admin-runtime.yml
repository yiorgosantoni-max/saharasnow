name: Repair admin runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin runtime safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('app/admin/page.tsx')
          s = page.read_text()
          s = s.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";\nimport { onAuthStateChanged } from "firebase/auth";')
          old = 'useEffect(()=>{const stop=getClientAuth().onAuthStateChanged(()=>load().catch(e=>setError(e.message)));return stop;},[]);'
          new = 'useEffect(()=>{const auth=getClientAuth();const stop=onAuthStateChanged(auth,()=>load().catch(e=>setError(e instanceof Error?e.message:"Unable to load admin dashboard")));return stop;},[]);'
          s = s.replace(old, new)
          s = s.replace('const rows=useMemo(()=>data?.[tab]||[],[data,tab]);', 'const rows=useMemo(()=>{const value=data?.[tab];return Array.isArray(value)?value:[];},[data,tab]);')
          s = s.replace('data?.kyc.filter(x=>x.status!=="approved").length||0', '(data?.kyc||[]).filter(x=>x.status!=="approved").length||0')
          s = s.replace('data?.listings.filter(x=>x.status!=="active").length||0', '(data?.listings||[]).filter(x=>x.status!=="active").length||0')
          s = s.replace('data?.withdrawals.filter(x=>String(x.status).includes("pending")).length||0', '(data?.withdrawals||[]).filter(x=>String(x.status).includes("pending")).length||0')
          page.write_text(s)

          route = Path('app/api/admin/route.ts')
          r = route.read_text()
          old_return = 'return NextResponse.json({adminEmail: ADMIN_EMAIL, kyc, listings, withdrawals, orders, tickets, users, auditLogs, reports});'
          new_return = 'const earnings = users.map((user: RecentItem) => ({id:user.id,name:user.name,email:user.email,mode:user.mode||user.accountMode||"BUYING",totalEarningsCents:Number(user.totalEarningsCents||0),pendingEarningsCents:Number(user.pendingEarningsCents||0),availableBalanceCents:Number(user.availableBalanceCents||0),withdrawnCents:Number(user.withdrawnCents||0)}));\n    return NextResponse.json({adminEmail: ADMIN_EMAIL, kyc, listings, withdrawals, orders, tickets, users, earnings, auditLogs, reports});'
          if old_return in r:
              r = r.replace(old_return, new_return)
          route.write_text(r)
          PY

      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx app/api/admin/route.ts
          git commit -m "Fix admin runtime crash and earnings data" || true
          git push
          rm .github/workflows/repair-admin-runtime.yml
          git add .github/workflows/repair-admin-runtime.yml
          git commit -m "Remove one-time admin repair workflow" || true
          git push
