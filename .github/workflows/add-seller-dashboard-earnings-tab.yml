name: Add seller dashboard earnings tab

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch seller dashboard card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = '<div className="dashboard"><div className="dashTitle">{tr("sellerOverview")} <b>•••</b></div>'
          new = '<div className="dashboard"><div className="dashTitle"><span>{tr("sellerOverview")}</span><button type="button" onClick={()=>{if(!loggedIn){openAuth();return}setAccountPanel("earnings")}} style={{background:"transparent",border:0,color:"inherit",font: "inherit",fontWeight:700,cursor:"pointer",padding:"4px 8px",borderRadius:8}}>Earnings</button><b>•••</b></div>'
          if old not in s:
              raise SystemExit('Target seller dashboard markup was not found; no changes made.')
          if 'setAccountPanel("earnings")' in s[s.index(old):s.index(old)+1200]:
              raise SystemExit('Seller dashboard Earnings tab already present; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/add-seller-dashboard-earnings-tab.yml
          git commit -m "Add Earnings tab to seller dashboard card"
          git rm .github/workflows/add-seller-dashboard-earnings-tab.yml
          git commit -m "Remove one-time seller dashboard repair workflow"
          git push