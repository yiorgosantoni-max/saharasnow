name: Persist buyer seller mode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-mode:
    if: ${{ !contains(github.event.head_commit.message, 'Persist buyer seller mode') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch mode persistence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/page.tsx';
          let s = fs.readFileSync(path, 'utf8');
          if (s.includes('// buyer-seller-mode-persistence-v1')) process.exit(0);

          const marker = '// buyer-seller-mode-persistence-v1';
          s = s.replace('"use client";', '"use client";\\n' + marker);

          const oldBegin = 'const beginSelling=(openListing=false)=>{if(!profileComplete){setMode("BUYING");setAccountPanel("profile");flash("Complete and save your first name, surname and country before selling.");return}setMode("SELLER");if(openListing)setListingOpen(true)};';
          const newBegin = 'const persistMode=async(nextMode:"BUYING"|"SELLER")=>{setMode(nextMode);const user=getClientAuth().currentUser;if(!user)return;try{const token=await user.getIdToken(true);const response=await fetch("/api/profile",{method:"PATCH",headers:{"content-type":"application/json",authorization:`Bearer ${token}`},body:JSON.stringify({mode:nextMode})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to save account mode");}catch(error){flash(error instanceof Error?error.message:"Unable to save account mode")}};\nconst beginSelling=async(openListing=false)=>{if(!profileComplete){await persistMode("BUYING");setAccountPanel("profile");flash("Complete and save your first name, surname and country before selling.");return}await persistMode("SELLER");if(openListing)setListingOpen(true)};';
          if (!s.includes(oldBegin)) throw new Error('Could not find beginSelling block; refusing to modify app/page.tsx');
          s = s.replace(oldBegin, newBegin);

          const oldBuyer = 'onClick={()=>setMode("BUYING")}';
          const newBuyer = 'onClick={()=>persistMode("BUYING")}';
          if (!s.includes(oldBuyer)) throw new Error('Could not find BUYING toggle; refusing to modify app/page.tsx');
          s = s.replace(oldBuyer, newBuyer);

          fs.writeFileSync(path, s);
          NODE

      - name: Commit patched mode persistence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/persist-buyer-seller-mode.yml
          git diff --cached --quiet || git commit -m "Persist buyer seller mode"
          git push
