name: Add seller edit button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Edit listing button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          marker = '<button className="deleteServiceButton" onClick={()=>deleteMyService(service)}>Delete service</button>'
          insert = '<a href={`/seller/edit/${service.id}`} className="editServiceButton">Edit listing</a>' + marker
          if 'className="editServiceButton"' in s:
              print('Edit button already present; nothing to do.')
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('Could not find the seller service delete button marker; refusing to modify page.tsx.')
          p.write_text(s.replace(marker, insert, 1))
          PY
      - name: Style Edit listing button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates=[Path('app/globals.css'),Path('app/page.css')]
          target=next((p for p in candidates if p.exists()),None)
          if target is None:
              print('No global CSS file found; inline browser defaults will be used.')
              raise SystemExit(0)
          s=target.read_text()
          css='.editServiceButton{display:inline-block;margin:8px 8px 0 0;padding:8px 12px;border:1px solid #17135f;border-radius:8px;background:#17135f;color:#fff;text-decoration:none;font-weight:700;font-size:13px}.editServiceButton:hover{opacity:.9}'
          if '.editServiceButton{' not in s:
              target.write_text(s+'\n\n'+css+'\n')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/globals.css app/page.css 2>/dev/null || git add app/page.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Show Edit listing button in seller services'
            git push
          fi
