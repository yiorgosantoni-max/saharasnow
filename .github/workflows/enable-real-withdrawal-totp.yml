name: Enable real withdrawal TOTP QR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[totp-qr-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install QR dependency
        run: npm install qrcode@1.5.4 --save

      - name: Patch withdrawal UI and enforcement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')

          old = 'const[withdrawOpen,setWithdrawOpen]=useState(false);const[authenticatorReady,setAuthenticatorReady]=useState(false);const[totp,setTotp]=useState("");'
          new = 'const[withdrawOpen,setWithdrawOpen]=useState(false);const[authenticatorReady,setAuthenticatorReady]=useState(false);const[totp,setTotp]=useState("");const[totpQrDataUrl,setTotpQrDataUrl]=useState("");const[totpSecretKey,setTotpSecretKey]=useState("");const[authenticatorSetupBusy,setAuthenticatorSetupBusy]=useState(false);'
          if old not in s:
              raise SystemExit('state marker not found')
          s = s.replace(old, new, 1)

          old = 'setSellerTotalEarnings(Number(profile.totalEarningsCents||0)/100);setSellerActiveOrders(Number(profile.activeOrderCount||0));'
          new = 'setSellerTotalEarnings(Number(profile.totalEarningsCents||0)/100);setAuthenticatorReady(Boolean(profile.totpEnabled));setSellerActiveOrders(Number(profile.activeOrderCount||0));'
          if old not in s:
              raise SystemExit('profile marker not found')
          s = s.replace(old, new, 1)

          old = 'const logout=async()=>{await signOutUser();'
          new = '''const loadAuthenticatorSetup=async()=>{const user=getClientAuth().currentUser;if(!user){flash("Please sign in again.");return}setAuthenticatorSetupBusy(true);try{const token=await user.getIdToken(true);const response=await fetch("/api/withdrawals/setup",{method:"POST",headers:{authorization:`Bearer ${token}`}});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to prepare Google Authenticator");setAuthenticatorReady(Boolean(data.enabled));if(data.qrDataUrl)setTotpQrDataUrl(String(data.qrDataUrl));if(data.secretKey)setTotpSecretKey(String(data.secretKey));}catch(error){flash(error instanceof Error?error.message:"Unable to prepare Google Authenticator")}finally{setAuthenticatorSetupBusy(false)}};\nconst logout=async()=>{await signOutUser();'''
          if old not in s:
              raise SystemExit('logout marker not found')
          s = s.replace(old, new, 1)

          old = 'useEffect(()=>{if(!accountPanel)return;'
          # No-op marker check: keep patch independent of effect ordering.
          if old not in s:
              raise SystemExit('account effect marker not found')

          insert_after = 'useEffect(()=>{if(accountPanel==="inbox"){loadInbox()}if(accountPanel==="notifications"){loadNotifications()}if(accountPanel==="orders"){loadOrders()}},[accountPanel]);'
          effect = 'useEffect(()=>{if(withdrawOpen&&!authenticatorReady)void loadAuthenticatorSetup()},[withdrawOpen,authenticatorReady]);'
          if effect not in s:
              if insert_after not in s:
                  raise SystemExit('withdraw effect insertion marker not found')
              s = s.replace(insert_after, insert_after + effect, 1)

          old = '<div className="qrDemo" aria-label="Authenticator QR code"><span>SAHARA<br/>SNOW</span></div><ol className="setupList">'
          new = '<div className="qrDemo" aria-label="Authenticator QR code">{authenticatorSetupBusy?<span>Loading…</span>:totpQrDataUrl?<img src={totpQrDataUrl} alt="Unique SaharaSnow Google Authenticator QR code" style={{width:"100%",height:"100%",objectFit:"contain"}}/>:<span>Unable to load QR</span>}</div>{totpSecretKey&&<div className="totpManualKey"><small>Manual setup key</small><b>{totpSecretKey}</b></div>}<ol className="setupList">'
          if old not in s:
              raise SystemExit('fake QR marker not found')
          s = s.replace(old, new, 1)

          old = 'onClick={()=>{setAuthenticatorReady(true);setTotp("");flash("Google Authenticator enabled for withdrawals.")}}'
          new = '''onClick={async()=>{const user=getClientAuth().currentUser;if(!user){flash("Please sign in again.");return}try{const token=await user.getIdToken(true);const response=await fetch("/api/withdrawals/setup",{method:"PUT",headers:{"content-type":"application/json",authorization:`Bearer ${token}`},body:JSON.stringify({code:totp})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to verify Google Authenticator");setAuthenticatorReady(true);setTotp("");flash("Google Authenticator enabled for withdrawals.")}catch(error){flash(error instanceof Error?error.message:"Unable to verify Google Authenticator")}}}'''
          if old not in s:
              raise SystemExit('confirm handler marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          w = Path('app/api/withdrawals/route.ts')
          ws = w.read_text(encoding='utf-8')
          old = 'const profile=(await tx.get(userRef)).data();if(!profile?.totpSecret||!authenticator.check(String(totp),profile.totpSecret))throw new Error("Invalid authenticator code");'
          new = 'const profile=(await tx.get(userRef)).data();if(!profile?.totpEnabled||!profile?.totpSecret||!authenticator.check(String(totp),profile.totpSecret))throw new Error("Google Authenticator verification is required before requesting a withdrawal");'
          if old not in ws:
              raise SystemExit('withdrawal enforcement marker not found')
          w.write_text(ws.replace(old,new,1), encoding='utf-8')
          PY

      - name: Build verification
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "saharasnow-bot"
          git config user.email "actions@saharasnow.com"
          git add package.json package-lock.json app/page.tsx app/api/withdrawals/route.ts app/api/withdrawals/setup/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: real per-user withdrawal authenticator QR [totp-qr-repair]"
          git push origin main
